<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Trip Tracker</title>
    <meta name="description" content="Track shared trip expenses, split costs, and settle up with the group." />

    <!-- Browser tab favicon -->
    <link rel="icon" type="image/svg+xml" href="/trip-tracker-favicon.svg" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1F7A63" />

    <!-- iOS "Add to Home Screen". Note: iOS Safari ignores SVG apple-touch-icons
         today and falls back to a page screenshot. If the home-screen icon
         doesn't render as the compass, export PNG versions and re-link below. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trip Tracker" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-192.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon-192.svg" />
    <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon-512.svg" />
    <link rel="apple-touch-icon" sizes="1024x1024" href="/apple-touch-icon-1024.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
